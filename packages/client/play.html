<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play · KickFi</title>
    <link rel="icon" type="image/png" href="/kfi-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  </head>
  <body>
    <nav class="nav">
      <div class="wrap nav__inner">
        <a class="brand" href="/index.html"><img src="/kickfi-logo.png" alt="KickFi" class="brand-logo" /></a>
        <div class="nav__links">
          <a href="/index.html">← Home</a>
          <button id="musicBtn" class="btn btn--sm btn--ghost" title="Toggle music">♪ MUSIC: OFF</button>
          <span id="walletPill" class="pill" style="display:none"></span>
        </div>
      </div>
    </nav>

    <main class="wrap play-main">
      <!-- match select -->
      <section class="pick" id="lobbyPick">
        <h2 class="pick__title">SELECT GAME MODE &amp; STYLE</h2>
        <div class="modes">
          <button class="mode-card mode-card--duel" data-format="1v1" data-mode="pvp" disabled>
            <span class="mode-card__title">1v1 DUEL</span>
            <span class="mode-card__select">SELECT</span>
          </button>
          <button class="mode-card mode-card--classic" data-format="3v3" data-mode="pvp" disabled>
            <span class="mode-card__title">3v3 CLASSIC</span>
            <span class="mode-card__select">SELECT</span>
          </button>
          <button class="mode-card mode-card--bots" data-format="3v3" data-mode="bots" disabled>
            <span class="mode-card__title">AI BOTS MODE</span>
            <span class="mode-card__select">SELECT</span>
          </button>
        </div>
        <div id="status" class="status">Connect a wallet to choose a match.</div>

        <!-- connect-wallet overlay -->
        <div class="pick__overlay" id="pickOverlay">
          <div class="pick__overlay-card">
            <div class="pick__overlay-title">CONNECT TO PLAY</div>
            <p class="pick__overlay-sub">Hold $KFi and connect to enter matchmaking.</p>
            <div class="pick__overlay-btns">
              <button id="connectBtn" class="btn btn--play">CONNECT WALLET</button>
            </div>
          </div>
        </div>
      </section>

      <!-- game + lobby (shown after selecting a match) -->
      <section class="game-area" id="gameArea" style="display:none">
        <div class="game-bar">
          <button id="exitBtn" class="btn btn--sm btn--ghost">← EXIT GAME</button>
        </div>
        <div id="gameWrap"></div>
        <p class="hint">Move: <b>WASD / Arrows</b> &nbsp;•&nbsp; Kick: <b>Space</b></p>

        <section class="chat" id="chat">
        <div class="chat__head">// LOBBY CHAT</div>
        <div class="chat__log" id="chatLog">
          <div class="chat__sys">Join a match to chat with your lobby.</div>
        </div>
        <form class="chat__form" id="chatForm">
          <input id="chatInput" class="chat__input" type="text" maxlength="200"
                 placeholder="Join a match to chat…" autocomplete="off" disabled />
          <button id="chatSend" class="btn btn--sm" type="submit" disabled>SEND</button>
        </form>
        </section>
      </section>

      <section class="section" id="leaderboard" style="padding-top:18px">
        <div class="label">// CURRENT STANDINGS</div>
        <div class="lb">
          <table>
            <thead><tr><th>#</th><th>Wallet</th><th>Wins</th><th>Goals</th></tr></thead>
            <tbody id="lbBody"><tr><td colspan="4">loading…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="gameOverModal" class="modal-overlay" style="display:none">
      <div class="modal">
        <div class="modal__title">GAME OVER</div>
        <div id="goWinner" class="modal__winner">—</div>
        <div id="goScore" class="modal__score">0 - 0</div>
        <div id="goResult" class="modal__result">&nbsp;</div>
        <div class="modal__btns">
          <button id="playAgainBtn" class="btn btn--green">▶ PLAY AGAIN</button>
          <button id="homeBtn" class="btn btn--ghost">← BACK TO HOME</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
